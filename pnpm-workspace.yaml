allowBuilds:
  esbuild: true
  # Its script only fetches a binary the platform package has
  unrs-resolver: false
  workerd: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gpahal/*'
trustPolicy: no-downgrade
# Versions older than 30 days (in minutes) are exempt, since some, such as `semver@6.3.1`, fail the
# check
trustPolicyIgnoreAfter: 43200
