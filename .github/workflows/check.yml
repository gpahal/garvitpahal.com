# Check pull requests before merge. `deploy.yml` calls this too, and deploys the build it uploads.
name: Check

on:
  pull_request:
  workflow_call:
    inputs:
      upload-build:
        description: Upload dist/ for the caller to deploy
        type: boolean
        default: false

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pin action SHAs because tags are mutable; `.github/dependabot.yml` updates them.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No token left in `.git/config` for install scripts to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install pnpm before setup-node resolves its cache; use packageManager for the version.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The CSP allows the deployment `PUBLIC_CONVEX_URL` names.
      - run: pnpm build
        env:
          PUBLIC_CONVEX_URL: ${{ vars.PUBLIC_CONVEX_URL }}

      # The marker is the log event only `src/lib/server/dev-owner-token.ts` writes. Only grep's
      # status 1, no match, passes.
      - name: The build leaves out the dev-only owner token
        run: |
          status=0
          grep -rl dev_only_unverified_owner_token dist/server || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::dist/server is missing, unreadable or holds the dev-only path that mints an owner token without verifying Access (grep status $status). See src/lib/server/dev-owner-token.ts."
            exit 1
          fi

      # Deploy exactly what was checked, with the committed `wrangler.jsonc` (`env.deploy`).
      - if: inputs.upload-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
